# Publishes the Locall website to GitHub Pages (ADR 0024).
#
# Runs when changes to the catalog, the website or the generator are pushed. Before publishing: runs the catalog and
# generator tests, and the generator refuses to build the site if the catalog does not carry a valid official signature.
#
# Security: every action is pinned to an exact commit (not to a tag, which its author could move); the build job can
# only read the repository; only the publishing job is allowed to publish.

name: Web

on:
  push:
    branches: [main]
    paths:
      - "catalogo/**"
      - "web/**"
      - "crates/locall-web/**"
      - "crates/locall-catalogo/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; if another arrives, it waits (a deployment is never cancelled halfway).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust 1.99.1 (same version as in development)
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: Catalog and generator tests
        run: cargo test --locked -p locall-catalogo -p locall-web

      - name: Generate the website (refuses if the catalog's signature is not valid)
        run: cargo run --locked -p locall-web -- _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  publicar:
    needs: generar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
