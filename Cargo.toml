# Workspace de Locall: agrupa todos los módulos (crates) del proyecto.
# Cada módulo vivirá en crates/<nombre> y heredará estos valores comunes.

[workspace]
resolver = "3"
members = ["crates/*"]
# Lo que compilan y prueban `cargo build` y `cargo test` sin indicar paquete: todo menos la app de escritorio
# (Tauri son más de 200 crates y necesita la interfaz ya construida). La app: `cargo build -p locall-app`.
default-members = [
    "crates/locall",
    "crates/locall-api",
    "crates/locall-catalogo",
    "crates/locall-cli",
    "crates/locall-compat",
    "crates/locall-config",
    "crates/locall-core",
    "crates/locall-download",
    "crates/locall-engine",
    "crates/locall-gguf",
    "crates/locall-registry",
    "crates/locall-scheduler",
    "crates/locall-store",
    "crates/locall-system",
    "crates/locall-web",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/alvaritoo89/Locall"
publish = false

# En modo desarrollo, Rust no optimiza el código para compilar rápido. Para el cálculo de sha256 eso lo hace muy
# lento con archivos de gigas, así que optimizamos solo esas bibliotecas (nuestro código sigue compilando rápido).
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3
