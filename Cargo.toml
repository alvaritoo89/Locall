# Locall workspace: groups all the modules (crates) of the project.
# Each module lives in crates/<name> and inherits these common values.

[workspace]
resolver = "3"
members = ["crates/*"]
# What `cargo build` and `cargo test` build and test when no package is given: everything except the desktop app
# (Tauri is over 200 crates and needs the UI already built). For the app: `cargo build -p locall-app`.
default-members = [
    "crates/locall",
    "crates/locall-api",
    "crates/locall-catalogo",
    "crates/locall-cli",
    "crates/locall-compat",
    "crates/locall-config",
    "crates/locall-core",
    "crates/locall-download",
    "crates/locall-engine",
    "crates/locall-gguf",
    "crates/locall-mutador",
    "crates/locall-registry",
    "crates/locall-scheduler",
    "crates/locall-store",
    "crates/locall-system",
    "crates/locall-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/alvaritoo89/Locall"
publish = false

# In development mode Rust does not optimize, to compile faster. That makes sha256 very slow on multi-gigabyte files,
# so only those libraries are optimized (our own code still compiles fast).
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3
