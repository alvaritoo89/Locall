[package]
name = "locall"
description = "Locall: the program (core, local API and command line)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "locall"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
locall-api = { path = "../locall-api" }
locall-cli = { path = "../locall-cli" }
locall-config = { path = "../locall-config" }
locall-core = { path = "../locall-core" }
locall-system = { path = "../locall-system" }
log = "0.4.35"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "signal", "sync", "time"] }

[dev-dependencies]
# The fake Hugging Face used in tests (shared with locall-api) computes fingerprints with the store.
locall-store = { path = "../locall-store" }
serde_json = "1.0.154"
