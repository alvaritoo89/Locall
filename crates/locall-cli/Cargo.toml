[package]
name = "locall-cli"
description = "Locall's command line: a client of the local API that starts the core when needed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Parses the command line (`--option=value`, `-abc`, text with unusual characters) without dependencies; the help and
# the error messages, in Spanish, are our own (ADR 0017).
lexopt = "0.3.2"
locall-config = { path = "../locall-config" }
locall-system = { path = "../locall-system" }
serde_json = "1.0.154"
# HTTP client to talk to the local API (127.0.0.1): no TLS.
ureq = { version = "3.5.1", default-features = false }
