[package]
name = "locall-core"
description = "Locall's core: brings the store, registry, downloads, scheduler and configuration together in a single service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
locall-catalogo = { path = "../locall-catalogo" }
locall-compat = { path = "../locall-compat" }
locall-config = { path = "../locall-config" }
locall-download = { path = "../locall-download" }
locall-engine = { path = "../locall-engine" }
locall-gguf = { path = "../locall-gguf" }
locall-registry = { path = "../locall-registry" }
locall-scheduler = { path = "../locall-scheduler" }
locall-store = { path = "../locall-store" }
# Machine and engine memory, to evaluate whether a model fits.
locall-system = { path = "../locall-system" }
log = "0.4.35"
serde_json = "1.0.154"
# Queries to the Hugging Face API, using Windows HTTPS (ADR 0010).
ureq = { version = "3.5.1", default-features = false, features = ["native-tls-no-default"] }

