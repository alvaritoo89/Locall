[package]
name = "locall-api"
description = "Locall's local API: an HTTP server on 127.0.0.1 with a token and protection against websites (ADR 0015)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# HTTP server (ADR 0015). HTTP/1.1 and JSON only: no HTTP/2, WebSockets or anything we do not use.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
# To stream responses in chunks (already in the project: axum brings it in).
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
locall-compat = { path = "../locall-compat" }
locall-config = { path = "../locall-config" }
locall-core = { path = "../locall-core" }
locall-engine = { path = "../locall-engine" }
locall-registry = { path = "../locall-registry" }
locall-scheduler = { path = "../locall-scheduler" }
# Machine information for the app (CPU, memory).
locall-system = { path = "../locall-system" }
log = "0.4.35"
serde_json = "1.0.154"
# To call the core (which uses plain threads) without blocking the server: spawn_blocking.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "sync", "time"] }

[dev-dependencies]
# To combine two waits in the idle-shutdown test.
futures-util = { version = "0.3.34", default-features = false }
# The fake Hugging Face used in tests computes fingerprints with the store.
locall-store = { path = "../locall-store" }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net"] }
# Client for the chat tests (understands chunked responses).
ureq = { version = "3.5.1", default-features = false }
locall-mutador = { path = "../locall-mutador" }
