[package]
name = "locall-app"
description = "Aplicación de escritorio de Locall (Tauri): un cliente más de la API local."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "locall-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# La parte Rust de la app habla con Locall igual que la CLI: reutiliza su cliente y el arranque bajo demanda.
locall-cli = { path = "../locall-cli" }
locall-config = { path = "../locall-config" }
# El portapapeles de Windows (botón «Copiar»): no depende de los permisos del navegador integrado.
locall-system = { path = "../locall-system" }
# La ventana normal de Windows para elegir un archivo (importar un .gguf). MIT. En Windows solo usa `windows-sys` y
# `raw-window-handle`, que ya estaban en el proyecto (ADR 0020).
rfd = { version = "=0.17.2", default-features = false }
serde_json = "1.0.154"
# Ventana con la interfaz web (WebView2 de Windows). ADR 0018.
tauri = { version = "2.12", features = [] }
