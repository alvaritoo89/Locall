[package]
name = "locall-app"
description = "Locall's desktop app (Tauri): just another client of the local API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "locall-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The Rust side of the app talks to Locall just like the CLI: it reuses its client and on-demand startup.
locall-cli = { path = "../locall-cli" }
locall-config = { path = "../locall-config" }
# The Windows clipboard (the «Copiar» button): does not depend on the embedded browser's permissions.
locall-system = { path = "../locall-system" }
# The standard Windows file picker (to import a .gguf). MIT. On Windows it only uses `windows-sys` and
# `raw-window-handle`, which were already in the project (ADR 0020).
rfd = { version = "=0.17.2", default-features = false }
serde_json = "1.0.154"
# Window with the web UI (Windows WebView2). ADR 0018.
tauri = { version = "2.12", features = [] }
