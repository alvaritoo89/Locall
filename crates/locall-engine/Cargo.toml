[package]
name = "locall-engine"
description = "Motor de Locall: arranca, vigila y para llama-server de forma segura."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Clave aleatoria del motor con el generador seguro del sistema.
getrandom = "0.4.3"
locall-system = { path = "../locall-system" }
# HTTP con el motor, que está en el mismo equipo (127.0.0.1): sin TLS.
ureq = { version = "3.5.1", default-features = false }
