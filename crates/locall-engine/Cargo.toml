[package]
name = "locall-engine"
description = "Locall's engine: starts, watches and stops llama-server safely."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Random engine key from the operating system's secure generator.
getrandom = "0.4.3"
locall-system = { path = "../locall-system" }
log = "0.4.35"
# Engine requests and responses in JSON (the API uses it too).
serde_json = "1.0.154"
# HTTP to the engine, which runs on the same machine (127.0.0.1): no TLS.
ureq = { version = "3.5.1", default-features = false }

[dev-dependencies]
locall-mutador = { path = "../locall-mutador" }
