[package]
name = "locall-config"
description = "Configuración de Locall: carpetas de datos y ajustes del usuario (config.toml), validados."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# La "fachada" estándar de registros de Rust (ya estaba en el proyecto, la trae ureq). MIT/Apache.
log = { version = "0.4.35", features = ["std"] }
# Para validar los hilos contra los del equipo.
locall-system = { path = "../locall-system" }

[dev-dependencies]
locall-mutador = { path = "../locall-mutador" }
