[package]
name = "locall-config"
description = "Locall's configuration: data folders and validated user settings (config.toml)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Rust's standard logging "facade" (already in the project, ureq brings it in). MIT/Apache.
log = { version = "0.4.35", features = ["std"] }
# To validate the thread count against the machine's.
locall-system = { path = "../locall-system" }

[dev-dependencies]
locall-mutador = { path = "../locall-mutador" }
