[package]
name = "locall-registry"
description = "Locall's registry (SQLite): installed models (which model each file is, where it came from, its license) and saved conversations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
locall-store = { path = "../locall-store" }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
