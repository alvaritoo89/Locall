[package]
name = "locall-download"
description = "Locall's downloader: sha256-verified, resumable downloads with stall detection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
locall-store = { path = "../locall-store" }
log = "0.4.35"
sha2 = "0.11.1"
# HTTPS with Windows TLS (SChannel) and its certificates (ADR 0010). No rustls and no optional features.
ureq = { version = "3.5.1", default-features = false, features = ["native-tls-no-default"] }
