[package]
name = "locall-store"
description = "Locall's model store: files stored once, by their sha256 fingerprint, and verified."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sha2 = "0.11.1"

# Windows only: query free disk space and how many names (hard links) a file has.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# Tests only: check with the GGUF reader that the snapshot of a split model works.
[dev-dependencies]
locall-gguf = { path = "../locall-gguf" }
