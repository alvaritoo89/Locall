[package]
name = "locall-store"
description = "Almacén de modelos de Locall: archivos guardados una sola vez por su huella sha256 y verificados."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sha2 = "0.11.1"

# Solo en Windows: preguntar el espacio libre del disco y cuántos nombres (enlaces duros) tiene un archivo.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# Solo para las pruebas: comprobar con el lector GGUF que la snapshot de un modelo dividido funciona.
[dev-dependencies]
locall-gguf = { path = "../locall-gguf" }
