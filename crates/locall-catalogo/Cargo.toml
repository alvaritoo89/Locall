[package]
name = "locall-catalogo"
description = "Locall's catalog of compatible models: format, validation and signature (minisign)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Verifies the catalog's minisign signature. MIT, no dependencies, no `unsafe` (ADR 0022).
minisign-verify = "=0.3.0"
serde_json = "1.0.154"

[dev-dependencies]
locall-mutador = { path = "../locall-mutador" }
