[package]
name = "locall-catalogo"
description = "El catálogo de modelos compatibles de Locall: formato, validación y firma (minisign)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Verificar la firma minisign del catálogo. MIT, sin dependencias, sin `unsafe` (ADR 0022).
minisign-verify = "=0.3.0"
serde_json = "1.0.154"

[dev-dependencies]
locall-mutador = { path = "../locall-mutador" }
